<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Atlas Lens Co. Viewfinder</title>

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Atlas FOV">

    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent-gold: #e5a93b;
            --accent-cyan: #00d2ff;
            --text-main: #ececec;
            --text-muted: #a0a0ab;
            --border: #33333d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--accent-gold);
            margin: 0 0 5px 0;
            font-size: 1.4rem;
            text-align: center;
        }

        .subtitle {
            color: var(--text-muted);
            margin: 0 0 15px 0;
            font-size: 0.85rem;
            text-align: center;
        }

        .container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 15px;
            width: 100%;
            max-width: 1100px;
        }

        @media (max-width: 800px) {
            .container { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
        }

        .control-group { margin-bottom: 12px; }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        select, input, button {
            width: 100%;
            padding: 10px;
            background: #141418;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        button.btn-primary {
            background: var(--accent-gold);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border: none;
            margin-top: 10px;
        }

        .custom-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
        }

        .hidden { display: none !important; }

        .viewfinder-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 340px;
        }

        video { display: none; }

        canvas {
            width: 100%;
            height: auto;
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 15px;
        }

        .stat-card {
            background: #141418;
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-card .val {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-gold);
        }

        .stat-card .lbl {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <h1>ATLAS LENS CO. VIEWFINDER</h1>
    <p class="subtitle">Anamorphic Lens Simulator & Framing Overlay</p>

    <div class="container">
        <div class="panel">
            <div class="control-group">
                <label for="cameraSelect">Target Camera / Sensor</label>
                <select id="cameraSelect">
                    <option value="35.70,20.10">Sony FX6 (16:9)</option>
                    <option value="35.90,23.90">Canon EOS R6 Mark III (3:2)</option>
                    <option value="36.70,25.54">ARRI ALEXA Mini LF (Open Gate)</option>
                    <option value="27.99,18.13">ARRI ALEXA 35 (4:3)</option>
                    <option value="40.96,21.60">RED V-Raptor 8K VV</option>
                    <option value="36.00,24.00">Sony Venice 2 (3:2)</option>
                    <option value="10.07,7.56">Apple iPhone 16 Pro (Main 4:3)</option>
                    <option value="custom">Custom Dimensions</option>
                </select>

                <div id="customGroup" class="custom-inputs hidden">
                    <div>
                        <label for="customWidth">W (mm)</label>
                        <input type="number" id="customWidth" value="36.00" step="0.1">
                    </div>
                    <div>
                        <label for="customHeight">H (mm)</label>
                        <input type="number" id="customHeight" value="24.00" step="0.1">
                    </div>
                </div>
            </div>

            <div class="control-group">
                <label for="seriesSelect">Lens Series</label>
                <select id="seriesSelect">
                    <option value="orion">Orion Series (2.0x Anamorphic)</option>
                    <option value="mercury">Mercury Series (1.5x Anamorphic)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="focalSelect">Focal Length</label>
                <select id="focalSelect"></select>
            </div>

            <button id="startCamBtn" class="btn-primary">Enable iPhone Camera Feed</button>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="val" id="hfovVal">0°</div>
                    <div class="lbl">Effective HFOV</div>
                </div>
                <div class="stat-card">
                    <div class="val" id="aspectVal">2.39:1</div>
                    <div class="lbl">Desqueezed Aspect</div>
                </div>
            </div>
        </div>

        <div class="panel viewfinder-wrapper">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="vfCanvas" width="960" height="540"></canvas>
        </div>
    </div>

    <script>
        const lensData = {
            orion: { squeeze: 2.0, focals: [18, 21, 25, 32, 40, 50, 65, 80, 100, 138, 200] },
            mercury: { squeeze: 1.5, focals: [24, 27, 32, 36, 42, 54, 72, 95, 138] }
        };

        // iPhone Main Wide lens focal length baseline (~24mm Full Frame equivalent)
        const IPHONE_BASE_FOCAL = 24;

        const cameraSelect = document.getElementById('cameraSelect');
        const customGroup = document.getElementById('customGroup');
        const customWidth = document.getElementById('customWidth');
        const customHeight = document.getElementById('customHeight');
        const seriesSelect = document.getElementById('seriesSelect');
        const focalSelect = document.getElementById('focalSelect');
        const startCamBtn = document.getElementById('startCamBtn');
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('vfCanvas');
        const ctx = canvas.getContext('2d');

        let cameraActive = false;

        function populateFocals() {
            const series = seriesSelect.value;
            focalSelect.innerHTML = '';
            lensData[series].focals.forEach(focal => {
                const opt = document.createElement('option');
                opt.value = focal;
                opt.textContent = `${focal}mm`;
                focalSelect.appendChild(opt);
            });
            focalSelect.selectedIndex = Math.floor(lensData[series].focals.length / 2);
        }

        function getSensor() {
            if (cameraSelect.value === 'custom') {
                return [parseFloat(customWidth.value) || 36, parseFloat(customHeight.value) || 24];
            }
            return cameraSelect.value.split(',').map(Number);
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: false
                });
                video.srcObject = stream;
                cameraActive = true;
                startCamBtn.style.display = 'none';
            } catch (err) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = stream;
                    cameraActive = true;
                    startCamBtn.style.display = 'none';
                } catch (e) {
                    alert("Unable to access camera: " + e.message);
                }
            }
        }

        function render() {
            const [sensorW, sensorH] = getSensor();
            const series = seriesSelect.value;
            const squeeze = lensData[series].squeeze;
            const focal = parseFloat(focalSelect.value);

            // Calculations
            const hfovRad = 2 * Math.atan((sensorW * squeeze) / (2 * focal));
            const hfovDeg = (hfovRad * (180 / Math.PI)).toFixed(1);
            const nativeAspect = sensorW / sensorH;
            const finalAspect = (nativeAspect * squeeze).toFixed(2);

            document.getElementById('hfovVal').textContent = `${hfovDeg}°`;
            document.getElementById('aspectVal').textContent = `${finalAspect}:1`;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // Target Desqueezed Aspect Box Bounds
            const targetWidthRatio = nativeAspect * squeeze;
            let drawH = canvas.height - 60;
            let drawW = drawH * targetWidthRatio;

            if (drawW > canvas.width - 60) {
                drawW = canvas.width - 60;
                drawH = drawW / targetWidthRatio;
            }

            const frameRect = {
                x: centerX - drawW / 2,
                y: centerY - drawH / 2,
                w: drawW,
                h: drawH
            };

            // Render live camera video with Anamorphic Squeeze + Optical Zoom
            if (cameraActive && video.readyState === video.HAVE_ENOUGH_DATA) {
                ctx.save();

                // Clip video strictly inside active desqueezed frame box
                ctx.beginPath();
                ctx.rect(frameRect.x, frameRect.y, frameRect.w, frameRect.h);
                ctx.clip();

                // Effective focal crop ratio relative to iPhone's base lens
                const effectiveFocal = focal / squeeze;
                const zoomFactor = Math.max(1, effectiveFocal / IPHONE_BASE_FOCAL);

                const srcW = video.videoWidth / zoomFactor;
                const srcH = video.videoHeight / zoomFactor;
                const srcX = (video.videoWidth - srcW) / 2;
                const srcY = (video.videoHeight - srcH) / 2;

                // Draw transformed, cropped, and unsqueezed camera feed
                ctx.drawImage(video, srcX, srcY, srcW, srcH, frameRect.x, frameRect.y, frameRect.w, frameRect.h);
                ctx.restore();
            } else {
                ctx.fillStyle = '#08080a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Outer Masking (Letterbox / Pillarbox)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            ctx.fillRect(0, 0, canvas.width, frameRect.y);
            ctx.fillRect(0, frameRect.y + frameRect.h, canvas.width, canvas.height - (frameRect.y + frameRect.h));
            ctx.fillRect(0, frameRect.y, frameRect.x, frameRect.h);
            ctx.fillRect(frameRect.x + frameRect.w, frameRect.y, canvas.width - (frameRect.x + frameRect.w), frameRect.h);

            // Active Frame Line Border
            ctx.strokeStyle = '#00d2ff';
            ctx.lineWidth = 3;
            ctx.strokeRect(frameRect.x, frameRect.y, frameRect.w, frameRect.h);

            // Crosshair
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(centerX - 12, centerY); ctx.lineTo(centerX + 12, centerY);
            ctx.moveTo(centerX, centerY - 12); ctx.lineTo(centerX, centerY + 12);
            ctx.stroke();

            // Lens Metadata Readout
            ctx.fillStyle = '#e5a93b';
            ctx.font = 'bold 14px -apple-system, sans-serif';
            ctx.fillText(`${series.toUpperCase()} ${focal}mm (${squeeze}x)`, frameRect.x + 10, frameRect.y + 22);

            requestAnimationFrame(render);
        }

        startCamBtn.addEventListener('click', startCamera);
        cameraSelect.addEventListener('change', () => {
            if (cameraSelect.value === 'custom') customGroup.classList.remove('hidden');
            else customGroup.classList.add('hidden');
        });
        seriesSelect.addEventListener('change', populateFocals);

        populateFocals();
        requestAnimationFrame(render);
    </script>
</body>
</html>
