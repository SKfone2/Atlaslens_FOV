<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Atlas Lens Co. Viewfinder</title>

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Atlas FOV">

    <!-- jsPDF Library for client-side PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --bg-color: #0d0d0f;
            --card-bg: #18181c;
            --accent-gold: #e5a93b;
            --accent-cyan: #00d2ff;
            --accent-red: #ff4d4d;
            --accent-green: #00b090;
            --accent-purple: #ff5cee;
            --text-main: #ececec;
            --text-muted: #a0a0ab;
            --border: #2a2a32;
            --font-futura: "Futura-Medium", "Futura", "Century Gothic", Avenir, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            font-family: var(--font-futura);
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-left: max(10px, env(safe-area-inset-left));
            padding-right: max(10px, env(safe-area-inset-right));
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .landscape-notice {
            background: rgba(229, 169, 59, 0.15);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            margin-bottom: 10px;
            text-align: center;
            width: 100%;
            max-width: 1280px;
            font-family: var(--font-futura);
            letter-spacing: 0.5px;
        }

        @media (orientation: landscape) {
            .landscape-notice { display: none; }
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 1280px;
        }

        .controls-header {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            align-items: end;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-family: var(--font-futura);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        select, input {
            font-family: var(--font-futura);
            width: 100%;
            padding: 8px 10px;
            background: #101013;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
        }

        select:focus, input:focus { border-color: var(--accent-gold); }

        button {
            font-family: var(--font-futura);
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            border: none;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            transition: opacity 0.15s ease;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button:active { opacity: 0.7; }

        button.btn-primary { background: var(--accent-gold); color: #000; }
        button.btn-danger { background: var(--accent-red); color: #fff; }
        button.btn-secondary { background: #282830; color: var(--text-main); border: 1px solid var(--border); }
        button.btn-shutter { background: var(--accent-green); color: #fff; }
        button.btn-lookbook { background: var(--accent-purple); color: #000; }

        .custom-inputs { display: flex; gap: 6px; }
        .hidden { display: none !important; }

        .viewfinder-stage {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--border);
        }

        video { display: none; }

        canvas {
            width: 100%;
            height: auto;
            max-height: 75vh;
            display: block;
            object-fit: contain;
        }

        .stats-bar {
            display: flex;
            gap: 15px;
            background: #101013;
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            justify-content: space-around;
            flex-wrap: wrap;
            font-family: var(--font-futura);
            align-items: center;
        }

        .stat-item {
            display: flex;
            gap: 6px;
            align-items: center;
            font-size: 0.8rem;
        }

        .stat-item .lbl { color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-item .val { color: var(--accent-gold); font-weight: 500; }

        .disclaimer-text {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-align: center;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            width: 100%;
            margin-top: 4px;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(10, 10, 12, 0.95);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            padding: 20px;
            padding-top: max(20px, env(safe-area-inset-top));
            overflow-y: auto;
            font-family: var(--font-futura);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .modal-title {
            font-size: 1.2rem;
            color: var(--accent-gold);
            font-weight: 500;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .lookbook-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            width: 100%;
        }

        .lookbook-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .lookbook-card img {
            width: 100%;
            height: auto;
            display: block;
            background: #000;
        }

        .lookbook-card-info {
            padding: 10px;
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .lookbook-card-info strong { color: var(--accent-gold); }

        .lookbook-card-btns {
            display: flex;
            gap: 6px;
            padding: 8px 10px;
            border-top: 1px solid var(--border);
            background: #101013;
        }

        .empty-msg {
            color: var(--text-muted);
            text-align: center;
            width: 100%;
            margin-top: 40px;
        }

        .binder-svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .project-list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .project-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .project-card.active-project {
            border-color: var(--accent-gold);
            background: rgba(229, 169, 59, 0.08);
        }

        .project-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .project-info h3 {
            margin: 0;
            font-size: 1rem;
            color: var(--text-main);
        }

        .project-info p {
            margin: 0;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .project-card-actions {
            display: flex;
            gap: 8px;
        }

        @media print {
            @page {
                size: letter;
                margin: 0.4in;
            }

            html, body {
                background: #ffffff !important;
                color: #000000 !important;
                height: auto !important;
                min-height: 0 !important;
                overflow: visible !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            body > *:not(#pdfPrintContainer) {
                display: none !important;
            }

            #pdfPrintContainer {
                position: relative !important;
                display: block !important;
                width: 100% !important;
                height: auto !important;
                background: #ffffff !important;
                color: #000000 !important;
                padding: 0 !important;
                margin: 0 !important;
                overflow: visible !important;
            }

            .no-print {
                display: none !important;
            }

            .print-grid.grid-2col {
                display: grid !important;
                grid-template-columns: 1fr 1fr !important;
                gap: 12px !important;
            }

            .print-grid.grid-1col {
                display: flex !important;
                flex-direction: column !important;
                gap: 20px !important;
            }

            .print-card {
                border: 1px solid #ccc !important;
                border-radius: 6px !important;
                padding: 10px !important;
                background: #ffffff !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                display: flex !important;
                flex-direction: column !important;
            }

            .print-card img {
                width: 100% !important;
                height: auto !important;
                object-fit: contain !important;
                border: 1px solid #999 !important;
                border-radius: 4px !important;
            }

            .grid-2col .print-card img {
                max-height: 2.2in !important;
            }

            .grid-1col .print-card img {
                max-height: 4.8in !important;
            }
        }
    </style>
</head>
<body>

    <div class="landscape-notice">
        🔄 Rotate your iPhone to <strong>Landscape Mode</strong> for maximum viewfinder size.
    </div>

    <div class="container">
        <!-- Control Header -->
        <div class="controls-header">
            <div class="control-group">
                <label for="projectSelect">Active Production</label>
                <div style="display: flex; gap: 6px;">
                    <select id="projectSelect"></select>
                    <button id="manageProjectsBtn" class="btn-secondary" style="width: auto; padding: 6px 10px;" title="Manage Projects">⚙️</button>
                </div>
            </div>

            <div class="control-group">
                <label for="cameraSelect">Camera System</label>
                <select id="cameraSelect">
                    <option value="sony_fx6">Sony FX6</option>
                    <option value="arri_alexa_mini_lf">ARRI ALEXA Mini LF</option>
                    <option value="arri_alexa_35">ARRI ALEXA 35</option>
                    <option value="sony_venice_2">Sony Venice 2</option>
                    <option value="red_v_raptor">RED V-Raptor 8K VV</option>
                    <option value="canon_r6m3">Canon EOS R6 Mark III</option>
                    <option value="iphone16pro">Apple iPhone 16 Pro</option>
                    <option value="custom">Custom Dimensions</option>
                </select>
            </div>

            <div class="control-group" id="modeGroup">
                <label for="modeSelect">Readout Mode</label>
                <select id="modeSelect"></select>
            </div>

            <div id="customGroup" class="control-group custom-inputs hidden">
                <div>
                    <label for="customWidth">W (mm)</label>
                    <input type="number" id="customWidth" value="36.00" step="0.1">
                </div>
                <div>
                    <label for="customHeight">H (mm)</label>
                    <input type="number" id="customHeight" value="24.00" step="0.1">
                </div>
            </div>

            <div class="control-group">
                <label for="seriesSelect">Lens Series</label>
                <select id="seriesSelect">
                    <option value="orion">Orion Series (2.0x Anamorphic)</option>
                    <option value="mercury">Mercury Series (1.5x Anamorphic)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="focalSelect">Focal Length</label>
                <select id="focalSelect"></select>
            </div>

            <div class="control-group">
                <label for="overlaySelect">Delivery Guide</label>
                <select id="overlaySelect">
                    <option value="none">Off (Active Sensor Only)</option>
                    <option value="2.39" selected>2.39:1 (Scope / Cinema)</option>
                    <option value="2.00">2.00:1 (Univisium / Stream)</option>
                    <option value="1.85">1.85:1 (Theatrical Flat)</option>
                    <option value="1.78">16:9 (1.78:1 HD Broadcast)</option>
                    <option value="1.00">1:1 (Square / Social)</option>
                    <option value="all">Show All Guides</option>
                </select>
            </div>

            <div class="control-group">
                <label>Feed Control</label>
                <button id="toggleCamBtn" class="btn-primary">Enable Camera</button>
            </div>

            <div class="control-group">
                <label>Direction</label>
                <button id="flipCamBtn" class="btn-secondary">🔄 Flip</button>
            </div>

            <div class="control-group">
                <label>Capture</label>
                <button id="snapBtn" class="btn-shutter">📸 Save Still</button>
            </div>

            <div class="control-group">
                <label>Project Deck</label>
                <button id="openLookbookBtn" class="btn-lookbook">
                    <svg class="binder-svg" viewBox="0 0 24 24">
                        <rect x="5" y="3" width="16" height="18" rx="2"></rect>
                        <line x1="5" y1="3" x2="5" y2="21"></line>
                        <circle cx="3" cy="7" r="1.2" fill="currentColor"></circle>
                        <circle cx="3" cy="12" r="1.2" fill="currentColor"></circle>
                        <circle cx="3" cy="17" r="1.2" fill="currentColor"></circle>
                    </svg>
                    Lookbook (<span id="shotCount">0</span>)
                </button>
            </div>
        </div>

        <!-- Viewfinder Stage -->
        <div class="viewfinder-stage">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="vfCanvas" width="1280" height="720"></canvas>
        </div>

        <!-- Readout Bar -->
        <div class="stats-bar">
            <div class="stat-item">
                <span class="lbl">Effective HFOV:</span>
                <span class="val" id="hfovVal">0°</span>
            </div>
            <div class="stat-item">
                <span class="lbl">Native Aspect:</span>
                <span class="val" id="aspectVal">2.39:1</span>
            </div>
            <div class="stat-item">
                <span class="lbl">Spherical Equiv:</span>
                <span class="val" id="equivVal">~0mm</span>
            </div>
            <div class="stat-item">
                <span class="lbl">Close Focus (MOD):</span>
                <span class="val" id="closeFocusVal">--</span>
            </div>
            <div class="disclaimer-text">
                *Pre-visualization tool only. Actual optical framing and distortion may vary on set.
            </div>
        </div>
    </div>

    <!-- Lookbook Drawer Modal -->
    <div id="lookbookModal" class="modal-overlay hidden">
        <div class="modal-header">
            <div class="modal-title" id="lookbookHeaderTitle">
                <svg class="binder-svg" style="width:20px; height:20px;" viewBox="0 0 24 24">
                    <rect x="5" y="3" width="16" height="18" rx="2"></rect>
                    <line x1="5" y1="3" x2="5" y2="21"></line>
                    <circle cx="3" cy="7" r="1.2" fill="currentColor"></circle>
                    <circle cx="3" cy="12" r="1.2" fill="currentColor"></circle>
                    <circle cx="3" cy="17" r="1.2" fill="currentColor"></circle>
                </svg>
                Project Lookbook & Shot Deck
            </div>
            <div class="modal-actions">
                <div style="display: flex; align-items: center; gap: 6px;">
                    <label style="margin: 0; color: var(--accent-gold); font-size: 0.7rem;">Print Layout:</label>
                    <select id="printLayoutSelect" style="width: auto; padding: 6px 8px;">
                        <option value="1col" selected>1 Shot / Row (Large)</option>
                        <option value="2col">2 Shots / Row (Compact Grid)</option>
                    </select>
                </div>
                <button id="downloadPdfDirectBtn" class="btn-primary" style="width: auto;">💾 Download PDF</button>
                <button id="exportPdfBtn" class="btn-secondary" style="width: auto;">🖨️ Print Sheet</button>
                <button id="clearLookbookBtn" class="btn-danger" style="width: auto;">🗑️ Clear Deck</button>
                <button id="closeLookbookBtn" class="btn-secondary" style="width: auto;">✖ Close</button>
            </div>
        </div>
        <div id="lookbookGrid" class="lookbook-grid"></div>
    </div>

    <!-- Project Manager Modal -->
    <div id="projectModal" class="modal-overlay hidden">
        <div class="modal-header">
            <div class="modal-title">📁 Production Project Manager</div>
            <div class="modal-actions">
                <button id="createNewProjectBtn" class="btn-primary" style="width: auto;">➕ New Project</button>
                <button id="importProjectBtn" class="btn-secondary" style="width: auto;">📥 Import .atlas Backup</button>
                <input type="file" id="importFileInput" accept=".atlas,.json" class="hidden">
                <button id="closeProjectModalBtn" class="btn-secondary" style="width: auto;">✖ Close</button>
            </div>
        </div>
        <div class="project-list-container" id="projectListContainer"></div>
    </div>

    <script>
        // CAMERA RESOLUTION & READOUT MODES DATABASE
        const cameraDatabase = {

                ]

        const IPHONE_BASE_FOCAL = 24;

        const projectSelect = document.getElementById('projectSelect');
        const manageProjectsBtn = document.getElementById('manageProjectsBtn');
        const cameraSelect = document.getElementById('cameraSelect');
        const modeSelect = document.getElementById('modeSelect');
        const modeGroup = document.getElementById('modeGroup');
        const customGroup = document.getElementById('customGroup');
        const customWidth = document.getElementById('customWidth');
        const customHeight = document.getElementById('customHeight');
        const seriesSelect = document.getElementById('seriesSelect');
        const focalSelect = document.getElementById('focalSelect');

            db = e.target.result;
            if (!db.objectStoreNames.contains("shots")) {
                db.createObjectStore("shots", { keyPath: "id", autoIncrement: true });
            }
            if (!db.objectStoreNames.contains("projects")) {
                const pStore = db.createObjectStore("projects", { keyPath: "name" });
                pStore.add({ name: "CLINCH", status: "active", camera: cameraSelect.value, created: new Date().toLocaleString() });

        function ensureDefaultProject() {
            if (!db) return;
            const tx = db.transaction("projects", "readwrite");
            const store = tx.objectStore("projects");
            const req = store.get(currentProjectName);
            req.onsuccess = () => {
                if (!req.result) {
                    store.add({ name: currentProjectName, status: "active", camera: cameraSelect.value, created: new Date().toLocaleString() });
                }
            };
        }

        function loadProjectDropdown() {
            if (!db) return;
            const tx = db.transaction("projects", "readonly");
            const req = tx.objectStore("projects").getAll();

            req.onsuccess = () => {
                const projects = req.result;
                projectSelect.innerHTML = '';
                
                projects.filter(p => p.status === 'active').forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.name;
                    opt.textContent = p.name;
                    if (p.name === currentProjectName) opt.selected = true;
                    projectSelect.appendChild(opt);
                });

                if (projectSelect.options.length === 0) {
                    const opt = document.createElement('option');
                    opt.value = "CLINCH";
                    opt.textContent = "CLINCH";
                    projectSelect.appendChild(opt);
                    currentProjectName = "CLINCH";
                }

            if (camKey === 'custom') {

                return;
            }

            customGroup.classList.add('hidden');
            modeGroup.classList.remove('hidden');
            modeSelect.innerHTML = '';

            const camObj = cameraDatabase[camKey];
            if (camObj) {
                camObj.modes.forEach((m, idx) => {
                    const opt = document.createElement('option');
                    opt.value = `${m.w},${m.h}`;
                    opt.textContent = m.name;
                    if (idx === 0) opt.selected = true;
                    modeSelect.appendChild(opt);
                });
            }

        function getSensor() {
            if (cameraSelect.value === 'custom') {
                return [parseFloat(customWidth.value) || 36, parseFloat(customHeight.value) || 24];
            }
            return modeSelect.value.split(',').map(Number);
        }

        function getFullCameraModeName() {
            if (cameraSelect.value === 'custom') {
                return `Custom (${customWidth.value} x ${customHeight.value}mm)`;
            }
            const camName = cameraDatabase[cameraSelect.value]?.label || "Camera";
            const modeName = modeSelect.options[modeSelect.selectedIndex]?.text || "";
            return `${camName} (${modeName})`;
        }

        function renderProjectManager() {
            if (!db) return;
            projectListContainer.innerHTML = '';

            const tx = db.transaction("projects", "readonly");
            const req = tx.objectStore("projects").getAll();

            req.onsuccess = () => {
                const projects = req.result;

                projects.forEach(p => {
                    const card = document.createElement('div');
                    card.className = `project-card ${p.name === currentProjectName ? 'active-project' : ''}`;
                    card.innerHTML = `
                        <div class="project-info">

                        </div>

                            <button class="btn-secondary" onclick="exportProjectBundle('${p.name}')">📦 Backup (.atlas)</button>
                            ${p.status === 'active' ? `<button class="btn-secondary" onclick="toggleArchiveProject('${p.name}', 'archived')">📁 Archive</button>` : `<button class="btn-secondary" onclick="toggleArchiveProject('${p.name}', 'active')">📂 Unarchive</button>`}

        window.switchActiveProject = (name) => {
            currentProjectName = name;

            loadProjectDropdown();
            updateShotCount();
            renderProjectManager();
        };

        window.toggleArchiveProject = (name, newStatus) => {
            const tx = db.transaction("projects", "readwrite");
            const store = tx.objectStore("projects");
            const req = store.get(name);
            req.onsuccess = () => {
                const proj = req.result;
                if (proj) {
                    proj.status = newStatus;
                    store.put(proj);
                    tx.oncomplete = () => {
                        loadProjectDropdown();
                        renderProjectManager();

                tx.objectStore("projects").delete(name);

                const shotStore = tx.objectStore("shots");
                const shotReq = shotStore.getAll();
                shotReq.onsuccess = () => {
                    shotReq.result.forEach(s => {
                        if (s.project === name) shotStore.delete(s.id);
                    });

                tx.objectStore("projects").put({

        window.exportProjectBundle = (projectName) => {
            const tx = db.transaction(["projects", "shots"], "readonly");
            const projReq = tx.objectStore("projects").get(projectName);
            const shotsReq = tx.objectStore("shots").getAll();

            tx.oncomplete = () => {
                const projectMeta = projReq.result || { name: projectName, status: "active" };
                const projectShots = shotsReq.result.filter(s => s.project === projectName);

                const bundle = {
                    atlas_version: "2.2",
                    project: projectMeta,
                    shots: projectShots,
                    exported_at: new Date().toLocaleString()
                };

                const jsonStr = JSON.stringify(bundle, null, 2);
                const blob = new Blob([jsonStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);

                const a = document.createElement("a");
                a.href = url;
                a.download = `${projectName.replace(/\s+/g, '_')}_Backup.atlas`;
                a.click();
                URL.revokeObjectURL(url);

        importFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const bundle = JSON.parse(event.target.result);
                    if (!bundle.project || !bundle.shots) {
                        alert("Invalid .atlas bundle file.");
                        return;
                    }

                    const tx = db.transaction(["projects", "shots"], "readwrite");
                    tx.objectStore("projects").put(bundle.project);

                    const shotStore = tx.objectStore("shots");
                    bundle.shots.forEach(s => {
                        delete s.id;
                        shotStore.add(s);
                    });

                    tx.oncomplete = () => {
                        alert(`Project "${bundle.project.name}" imported successfully with ${bundle.shots.length} shots!`);
                        switchActiveProject(bundle.project.name);
                        renderProjectManager();
                    };

        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            try {
                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: facingMode }, width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: false
                });
                video.srcObject = currentStream;
                cameraActive = true;
                updateButtonState();
            } catch (err) {
                try {
                    currentStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = currentStream;
                    cameraActive = true;
                    updateButtonState();
                } catch (e) {
                    alert("Unable to access camera: " + e.message);
                }
            }
        }

        function stopCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            video.srcObject = null;
            cameraActive = false;
            updateButtonState();
        }

        downloadPdfDirectBtn.addEventListener('click', () => {

            const layout = printLayoutSelect.value;

            const req = tx.objectStore("shots").getAll();

                if (shots.length === 0) {
                    alert("No shots to export!");
                    return;
                }

                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('portrait', 'pt', 'letter');
                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();

                let yPos = 40;

                pdf.setFont("helvetica", "bold");
                pdf.setFontSize(16);
                pdf.text(`${currentProjectName.toUpperCase()} — SHOT SHEET`, 40, yPos);
                
                pdf.setFont("helvetica", "normal");
                pdf.setFontSize(8);
                pdf.setTextColor(100);
                pdf.text(`ATLAS LENS CO. VIEWFINDER | Total Shots: ${shots.length} | Generated: ${new Date().toLocaleString()}`, 40, yPos + 14);
                pdf.text(`*DISCLAIMER: For pre-visualization purposes only. Actual framing and optical results may vary on set.`, 40, yPos + 24);

                pdf.setLineWidth(1);
                pdf.setDrawColor(200);
                pdf.line(40, yPos + 30, pageWidth - 40, yPos + 30);

                yPos += 45;

                if (layout === '1col') {
                    const colWidth = pageWidth - 80;
                    const imgHeight = colWidth * (9 / 16);

                    for (let i = 0; i < shots.length; i++) {
                        const shot = shots[i];

                        if (yPos + imgHeight + 50 > pageHeight) {
                            pdf.addPage();
                            yPos = 40;
                        }

                        pdf.addImage(shot.image, 'PNG', 40, yPos, colWidth, imgHeight);
                        pdf.setDrawColor(180);
                        pdf.rect(40, yPos, colWidth, imgHeight);

                        pdf.setFontSize(10);
                        pdf.setFont("helvetica", "bold");
                        pdf.setTextColor(0);
                        pdf.text(`Shot #${i + 1} — ${shot.series} ${shot.focal} (Close Focus: ${shot.closeFocus || 'N/A'})`, 40, yPos + imgHeight + 14);

                        pdf.setFont("helvetica", "normal");
                        pdf.setFontSize(9);
                        pdf.setTextColor(80);
                        pdf.text(`Camera: ${shot.camera}  |  HFOV: ${shot.hfov}  |  Aspect Ratio: ${shot.aspect}  |  Captured: ${shot.timestamp}`, 40, yPos + imgHeight + 26);

                        yPos += imgHeight + 45;
                    }
                } else {
                    const colWidth = (pageWidth - 100) / 2;
                    const imgHeight = colWidth * (9 / 16);

                    for (let i = 0; i < shots.length; i++) {
                        const shot = shots[i];
                        const col = i % 2;
                        const xPos = 40 + col * (colWidth + 20);

                        if (col === 0 && i > 0 && yPos + imgHeight + 60 > pageHeight) {
                            pdf.addPage();
                            yPos = 40;
                        }

                        pdf.addImage(shot.image, 'PNG', xPos, yPos, colWidth, imgHeight);
                        pdf.setDrawColor(180);
                        pdf.rect(xPos, yPos, colWidth, imgHeight);

                        pdf.setFontSize(9);
                        pdf.setFont("helvetica", "bold");
                        pdf.setTextColor(0);
                        pdf.text(`Shot #${i + 1} — ${shot.series} ${shot.focal}`, xPos, yPos + imgHeight + 12);

                        pdf.setFont("helvetica", "normal");
                        pdf.setTextColor(80);
                        pdf.text(`CF: ${shot.closeFocus || 'N/A'} | Camera: ${shot.camera}`, xPos, yPos + imgHeight + 22);
                        pdf.text(`HFOV: ${shot.hfov} | Aspect: ${shot.aspect}`, xPos, yPos + imgHeight + 32);

                        if (col === 1 || i === shots.length - 1) {
                            yPos += imgHeight + 50;
                        }
                    }
                }

                pdf.save(`${currentProjectName.replace(/\s+/g, '_')}_Shot_Sheet.pdf`);
            };
        });

        function drawGuideBox(frameRect, targetRatio, color, labelText) {
            const currentRatio = frameRect.w / frameRect.h;
            let guideW, guideH;

            if (targetRatio <= currentRatio) {
                guideH = frameRect.h;
                guideW = guideH * targetRatio;
            } else {
                guideW = frameRect.w;
                guideH = guideW / targetRatio;
            }

            const gx = frameRect.x + (frameRect.w - guideW) / 2;
            const gy = frameRect.y + (frameRect.h - guideH) / 2;

            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 4]);
            ctx.strokeRect(gx, gy, guideW, guideH);
            ctx.setLineDash([]);

            ctx.fillStyle = color;
            ctx.font = '11px "Futura-Medium", "Futura", sans-serif';
            ctx.fillText(labelText, gx + 6, gy + 14);
        }

        function render() {
            const [sensorW, sensorH] = getSensor();
            const series = seriesSelect.value;
            const squeeze = lensData[series].squeeze;
            const lensMeta = getSelectedLensMeta();
            const focal = lensMeta.focal;
            const overlayMode = overlaySelect.value;

            // Calculations
            const hfovRad = 2 * Math.atan((sensorW * squeeze) / (2 * focal));
            const hfovDeg = (hfovRad * (180 / Math.PI)).toFixed(1);
            const nativeAspect = sensorW / sensorH;
            const finalAspect = (nativeAspect * squeeze).toFixed(2);
            const sphericalEquiv = Math.round(focal / squeeze);

            document.getElementById('hfovVal').textContent = `${hfovDeg}°`;
            document.getElementById('aspectVal').textContent = `${finalAspect}:1`;
            document.getElementById('equivVal').textContent = `~${sphericalEquiv}mm`;
            document.getElementById('closeFocusVal').textContent = `${lensMeta.cfFt} (${lensMeta.cfM})`;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            const effectiveFocal = focal / squeeze;
            const targetWidthRatio = nativeAspect * squeeze;
            const wideScaleFactor = Math.min(1, effectiveFocal / IPHONE_BASE_FOCAL);

            let drawH = (canvas.height - 40) * wideScaleFactor;
            let drawW = drawH * targetWidthRatio;

            if (drawW > canvas.width - 40) {
                drawW = canvas.width - 60;
                drawH = drawW / targetWidthRatio;
            }

            const frameRect = {
                x: centerX - drawW / 2,
                y: centerY - drawH / 2,
                w: drawW,
                h: drawH
            };

            // Render camera stream
            if (cameraActive && video.readyState === video.HAVE_ENOUGH_DATA) {
                ctx.save();

                ctx.beginPath();
                ctx.rect(frameRect.x, frameRect.y, frameRect.w, frameRect.h);
                ctx.clip();

                const zoomFactor = Math.max(1, effectiveFocal / IPHONE_BASE_FOCAL);

                const srcW = video.videoWidth / zoomFactor;
                const srcH = video.videoHeight / zoomFactor;
                const srcX = (video.videoWidth - srcW) / 2;
                const srcY = (video.videoHeight - srcH) / 2;

                if (facingMode === "user") {
                    ctx.translate(canvas.width, 0);
                    ctx.scale(-1, 1);
                    const mirroredX = canvas.width - (frameRect.x + frameRect.w);
                    ctx.drawImage(video, srcX, srcY, srcW, srcH, mirroredX, frameRect.y, frameRect.w, frameRect.h);
                } else {
                    ctx.drawImage(video, srcX, srcY, srcW, srcH, frameRect.x, frameRect.y, frameRect.w, frameRect.h);
                }

                ctx.restore();
            } else {
                ctx.fillStyle = '#08080a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#a0a0ab';
                ctx.font = '16px "Futura-Medium", "Futura", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Camera Feed Disabled', centerX, centerY);
                ctx.textAlign = 'left';
            }

            // Outer Sensor Letterbox Matte
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(0, 0, canvas.width, frameRect.y);
            ctx.fillRect(0, frameRect.y + frameRect.h, canvas.width, canvas.height - (frameRect.y + frameRect.h));
            ctx.fillRect(0, frameRect.y, frameRect.x, frameRect.h);
            ctx.fillRect(frameRect.x + frameRect.w, frameRect.y, canvas.width - (frameRect.x + frameRect.w), frameRect.h);

            // Active Sensor Border (Cyan Solid)
            ctx.strokeStyle = '#00d2ff';
            ctx.lineWidth = 3;
            ctx.strokeRect(frameRect.x, frameRect.y, frameRect.w, frameRect.h);

            // Delivery Aspect Ratio Overlays
            if (overlayMode === 'all') {
                drawGuideBox(frameRect, 2.39, '#e5a93b', '2.39:1 Scope');
                drawGuideBox(frameRect, 2.00, '#ff007f', '2.00:1 Stream');
                drawGuideBox(frameRect, 1.85, '#34c759', '1.85:1 Flat');
                drawGuideBox(frameRect, 1.78, '#ffffff', '16:9 HD');
                drawGuideBox(frameRect, 1.00, '#a0a0ab', '1:1 Square');
            } else if (overlayMode !== 'none') {
                const ratio = parseFloat(overlayMode);
                const label = `${ratio}:1 Guide`;
                drawGuideBox(frameRect, ratio, '#e5a93b', label);
            }

            // Center Crosshair
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(centerX - 16, centerY); ctx.lineTo(centerX + 16, centerY);
            ctx.moveTo(centerX, centerY - 16); ctx.lineTo(centerX, centerY + 16);
            ctx.stroke();

            // On-screen Lens Metadata Readout (Top Left)
            ctx.fillStyle = '#e5a93b';
            ctx.font = '500 15px "Futura-Medium", "Futura", sans-serif';
            ctx.fillText(`${series.toUpperCase()} ${focal}mm (${squeeze}x) | CF: ${lensMeta.cfFt}`, frameRect.x + 14, frameRect.y + 26);

            // On-screen Project Title Burn-in (Top Right)
            ctx.fillStyle = '#00d2ff';
            ctx.font = '500 14px "Futura-Medium", "Futura", sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(currentProjectName.toUpperCase(), frameRect.x + frameRect.w - 14, frameRect.y + 26);

            // On-screen Pre-Vis Disclaimer Watermark (Bottom Center)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.font = '10px "Futura-Medium", "Futura", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('*PRE-VISUALIZATION ONLY — ACTUAL RESULTS MAY VARY', centerX, frameRect.y + frameRect.h - 10);
            ctx.textAlign = 'left';

            requestAnimationFrame(render);
        }

        // Event Listeners
        toggleCamBtn.addEventListener('click', () => {
            if (cameraActive) stopCamera();
            else startCamera();
        });

        flipCamBtn.addEventListener('click', () => {
            facingMode = (facingMode === "environment") ? "user" : "environment";
            if (cameraActive) startCamera();
        });

        snapBtn.addEventListener('click', captureStill);
        openLookbookBtn.addEventListener('click', loadLookbook);
        closeLookbookBtn.addEventListener('click', () => lookbookModal.classList.add('hidden'));

        cameraSelect.addEventListener('change', populateCameraModes);
        modeSelect.addEventListener('change', () => {
            // Force redraw on readout mode change
        });

        seriesSelect.addEventListener('change', populateFocals);
        focalSelect.addEventListener('change', () => {
            // Force redraw on focal length change
        });

        populateCameraModes();
        populateFocals();
        requestAnimationFrame(render);
    </script>
</body>
</html>
