<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Atlas Lens Co. Viewfinder</title>

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Atlas FOV">

    <!-- jsPDF Library for client-side PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --bg-color: #0d0d0f;
            --card-bg: #18181c;
            --accent-gold: #e5a93b;
            --accent-cyan: #00d2ff;
            --accent-red: #ff4d4d;
            --accent-green: #00b090;
            --accent-purple: #ff5cee;
            --text-main: #ececec;
            --text-muted: #a0a0ab;
            --border: #2a2a32;
            --font-futura: "Futura-Medium", "Futura", "Century Gothic", Avenir, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            font-family: var(--font-futura);
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .landscape-notice {
            background: rgba(229, 169, 59, 0.15);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            margin-bottom: 10px;
            text-align: center;
            width: 100%;
            max-width: 1280px;
            font-family: var(--font-futura);
            letter-spacing: 0.5px;
        }

        @media (orientation: landscape) {
            .landscape-notice { display: none; }
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 1280px;
        }

        .controls-header {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            align-items: end;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-family: var(--font-futura);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        select, input {
            font-family: var(--font-futura);
            width: 100%;
            padding: 8px 10px;
            background: #101013;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
        }

        select:focus, input:focus { border-color: var(--accent-gold); }

        button {
            font-family: var(--font-futura);
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            border: none;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            transition: opacity 0.15s ease;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button:active { opacity: 0.7; }

        button.btn-primary { background: var(--accent-gold); color: #000; }
        button.btn-danger { background: var(--accent-red); color: #fff; }
        button.btn-secondary { background: #282830; color: var(--text-main); border: 1px solid var(--border); }
        button.btn-shutter { background: var(--accent-green); color: #fff; }
        button.btn-lookbook { background: var(--accent-purple); color: #000; }

        .custom-inputs { display: flex; gap: 6px; }
        .hidden { display: none !important; }

        .viewfinder-stage {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--border);
        }

        video { display: none; }

        canvas {
            width: 100%;
            height: auto;
            max-height: 75vh;
            display: block;
            object-fit: contain;
        }

        .stats-bar {
            display: flex;
            gap: 15px;
            background: #101013;
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            justify-content: space-around;
            flex-wrap: wrap;
            font-family: var(--font-futura);
            align-items: center;
        }

        .stat-item {
            display: flex;
            gap: 6px;
            align-items: center;
            font-size: 0.8rem;
        }

        .stat-item .lbl { color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-item .val { color: var(--accent-gold); font-weight: 500; }

        .disclaimer-text {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-align: center;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Lookbook Overlay Drawer */
        .lookbook-modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(10, 10, 12, 0.95);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            font-family: var(--font-futura);
        }

        .lookbook-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .lookbook-title {
            font-size: 1.2rem;
            color: var(--accent-gold);
            font-weight: 500;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lookbook-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .lookbook-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            width: 100%;
        }

        .lookbook-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .lookbook-card img {
            width: 100%;
            height: auto;
            display: block;
            background: #000;
        }

        .lookbook-card-info {
            padding: 10px;
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .lookbook-card-info strong { color: var(--accent-gold); }

        .lookbook-card-btns {
            display: flex;
            gap: 6px;
            padding: 8px 10px;
            border-top: 1px solid var(--border);
            background: #101013;
        }

        .empty-msg {
            color: var(--text-muted);
            text-align: center;
            width: 100%;
            margin-top: 40px;
        }

        .binder-svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* --- MULTI-PAGE ADAPTIVE PRINT ENGINE --- */
        @media print {
            @page {
                size: letter;
                margin: 0.4in;
            }

            html, body {
                background: #ffffff !important;
                color: #000000 !important;
                height: auto !important;
                min-height: 0 !important;
                overflow: visible !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            body > *:not(#pdfPrintContainer) {
                display: none !important;
            }

            #pdfPrintContainer {
                position: relative !important;
                display: block !important;
                width: 100% !important;
                height: auto !important;
                background: #ffffff !important;
                color: #000000 !important;
                padding: 0 !important;
                margin: 0 !important;
                overflow: visible !important;
            }

            .no-print {
                display: none !important;
            }

            .print-grid.grid-2col {
                display: grid !important;
                grid-template-columns: 1fr 1fr !important;
                gap: 12px !important;
            }

            .print-grid.grid-1col {
                display: flex !important;
                flex-direction: column !important;
                gap: 20px !important;
            }

            .print-card {
                border: 1px solid #ccc !important;
                border-radius: 6px !important;
                padding: 10px !important;
                background: #ffffff !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                display: flex !important;
                flex-direction: column !important;
            }

            .print-card img {
                width: 100% !important;
                height: auto !important;
                object-fit: contain !important;
                border: 1px solid #999 !important;
                border-radius: 4px !important;
            }

            .grid-2col .print-card img {
                max-height: 2.2in !important;
            }

            .grid-1col .print-card img {
                max-height: 4.8in !important;
            }
        }
    </style>
</head>
<body>

    <div class="landscape-notice">
        🔄 Rotate your iPhone to <strong>Landscape Mode</strong> for maximum viewfinder size.
    </div>

    <div class="container">
        <!-- Control Header -->
        <div class="controls-header">
            <div class="control-group">
                <label for="projectInput">Project Title</label>
                <input type="text" id="projectInput" placeholder="e.g. Feature Film 2026" value="CLINCH">
            </div>

            <div class="control-group">
                <label for="cameraSelect">Camera / Sensor</label>
                <select id="cameraSelect">
                    <option value="35.70,20.10">Sony FX6 (16:9)</option>
                    <option value="35.90,23.90">Canon EOS R6 Mark III (3:2)</option>
                    <option value="36.70,25.54">ARRI ALEXA Mini LF (Open Gate)</option>
                    <option value="27.99,18.13">ARRI ALEXA 35 (4:3)</option>
                    <option value="40.96,21.60">RED V-Raptor 8K VV</option>
                    <option value="36.00,24.00">Sony Venice 2 (3:2)</option>
                    <option value="10.07,7.56">Apple iPhone 16 Pro (Main 4:3)</option>
                    <option value="custom">Custom Dimensions</option>
                </select>
            </div>

            <div id="customGroup" class="control-group custom-inputs hidden">
                <div>
                    <label for="customWidth">W (mm)</label>
                    <input type="number" id="customWidth" value="36.00" step="0.1">
                </div>
                <div>
                    <label for="customHeight">H (mm)</label>
                    <input type="number" id="customHeight" value="24.00" step="0.1">
                </div>
            </div>

            <div class="control-group">
                <label for="seriesSelect">Lens Series</label>
                <select id="seriesSelect">
                    <option value="orion">Orion Series (2.0x Anamorphic)</option>
                    <option value="mercury">Mercury Series (1.5x Anamorphic)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="focalSelect">Focal Length</label>
                <select id="focalSelect"></select>
            </div>

            <div class="control-group">
                <label for="overlaySelect">Delivery Guide</label>
                <select id="overlaySelect">
                    <option value="none">Off (Active Sensor Only)</option>
                    <option value="2.39" selected>2.39:1 (Scope / Cinema)</option>
                    <option value="2.00">2.00:1 (Univisium / Stream)</option>
                    <option value="1.85">1.85:1 (Theatrical Flat)</option>
                    <option value="1.78">16:9 (1.78:1 HD Broadcast)</option>
                    <option value="1.00">1:1 (Square / Social)</option>
                    <option value="all">Show All Guides</option>
                </select>
            </div>

            <div class="control-group">
                <label>Feed Control</label>
                <button id="toggleCamBtn" class="btn-primary">Enable Camera</button>
            </div>

            <div class="control-group">
                <label>Direction</label>
                <button id="flipCamBtn" class="btn-secondary">🔄 Flip</button>
            </div>

            <div class="control-group">
                <label>Capture</label>
                <button id="snapBtn" class="btn-shutter">📸 Save Still</button>
            </div>

            <div class="control-group">
                <label>Project Deck</label>
                <button id="openLookbookBtn" class="btn-lookbook">
                    <svg class="binder-svg" viewBox="0 0 24 24">
                        <rect x="5" y="3" width="16" height="18" rx="2"></rect>
                        <line x1="5" y1="3" x2="5" y2="21"></line>
                        <circle cx="3" cy="7" r="1.2" fill="currentColor"></circle>
                        <circle cx="3" cy="12" r="1.2" fill="currentColor"></circle>
                        <circle cx="3" cy="17" r="1.2" fill="currentColor"></circle>
                    </svg>
                    Lookbook (<span id="shotCount">0</span>)
                </button>
            </div>
        </div>

        <!-- Viewfinder Stage -->
        <div class="viewfinder-stage">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="vfCanvas" width="1280" height="720"></canvas>
        </div>

        <!-- Readout Bar -->
        <div class="stats-bar">
            <div class="stat-item">
                <span class="lbl">Effective HFOV:</span>
                <span class="val" id="hfovVal">0°</span>
            </div>
            <div class="stat-item">
                <span class="lbl">Native Aspect:</span>
                <span class="val" id="aspectVal">2.39:1</span>
            </div>
            <div class="stat-item">
                <span class="lbl">Spherical Equiv:</span>
                <span class="val" id="equivVal">~0mm</span>
            </div>
            <div class="disclaimer-text">
                *Pre-visualization tool only. Actual optical framing and distortion may vary on set.
            </div>
        </div>
    </div>

    <!-- Lookbook Modal -->
    <div id="lookbookModal" class="lookbook-modal hidden">
        <div class="lookbook-header">
            <div class="lookbook-title" id="lookbookHeaderTitle">
                <svg class="binder-svg" style="width:20px; height:20px;" viewBox="0 0 24 24">
                    <rect x="5" y="3" width="16" height="18" rx="2"></rect>
                    <line x1="5" y1="3" x2="5" y2="21"></line>
                    <circle cx="3" cy="7" r="1.2" fill="currentColor"></circle>
                    <circle cx="3" cy="12" r="1.2" fill="currentColor"></circle>
                    <circle cx="3" cy="17" r="1.2" fill="currentColor"></circle>
                </svg>
                Project Lookbook & Shot Deck
            </div>
            <div class="lookbook-actions">
                <div style="display: flex; align-items: center; gap: 6px;">
                    <label style="margin: 0; color: var(--accent-gold); font-size: 0.7rem;">Print Layout:</label>
                    <select id="printLayoutSelect" style="width: auto; padding: 6px 8px;">
                        <option value="1col" selected>1 Shot / Row (Large)</option>
                        <option value="2col">2 Shots / Row (Compact Grid)</option>
                    </select>
                </div>
                <button id="downloadPdfDirectBtn" class="btn-primary" style="width: auto;">💾 Download PDF</button>
                <button id="exportPdfBtn" class="btn-secondary" style="width: auto;">🖨️ Print Sheet</button>
                <button id="clearLookbookBtn" class="btn-danger" style="width: auto;">🗑️ Clear Deck</button>
                <button id="closeLookbookBtn" class="btn-secondary" style="width: auto;">✖ Close</button>
            </div>
        </div>
        <div id="lookbookGrid" class="lookbook-grid"></div>
    </div>

    <script>
        const lensData = {
            orion: { squeeze: 2.0, focals: [18, 21, 25, 32, 40, 50, 65, 80, 100, 138, 200] },
            mercury: { squeeze: 1.5, focals: [24, 27, 32, 36, 42, 54, 72, 95, 138] }
        };

        const IPHONE_BASE_FOCAL = 24;

        const projectInput = document.getElementById('projectInput');
        const cameraSelect = document.getElementById('cameraSelect');
        const customGroup = document.getElementById('customGroup');
        const customWidth = document.getElementById('customWidth');
        const customHeight = document.getElementById('customHeight');
        const seriesSelect = document.getElementById('seriesSelect');
        const focalSelect = document.getElementById('focalSelect');
        const overlaySelect = document.getElementById('overlaySelect');
        const toggleCamBtn = document.getElementById('toggleCamBtn');
        const flipCamBtn = document.getElementById('flipCamBtn');
        const snapBtn = document.getElementById('snapBtn');
        const openLookbookBtn = document.getElementById('openLookbookBtn');
        const closeLookbookBtn = document.getElementById('closeLookbookBtn');
        const downloadPdfDirectBtn = document.getElementById('downloadPdfDirectBtn');
        const exportPdfBtn = document.getElementById('exportPdfBtn');
        const printLayoutSelect = document.getElementById('printLayoutSelect');
        const clearLookbookBtn = document.getElementById('clearLookbookBtn');
        const lookbookModal = document.getElementById('lookbookModal');
        const lookbookGrid = document.getElementById('lookbookGrid');
        const lookbookHeaderTitle = document.getElementById('lookbookHeaderTitle');
        const shotCountEl = document.getElementById('shotCount');
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('vfCanvas');
        const ctx = canvas.getContext('2d');

        let cameraActive = false;
        let currentStream = null;
        let facingMode = "environment";
        let db = null;

        if (localStorage.getItem("atlas_project_name")) {
            projectInput.value = localStorage.getItem("atlas_project_name");
        }

        projectInput.addEventListener('input', () => {
            localStorage.setItem("atlas_project_name", projectInput.value);
        });

        // IndexedDB Database Setup
        const dbReq = indexedDB.open("AtlasLookbookDB", 1);
        dbReq.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains("shots")) {
                db.createObjectStore("shots", { keyPath: "id", autoIncrement: true });
            }
        };
        dbReq.onsuccess = (e) => {
            db = e.target.result;
            updateShotCount();
        };

        function populateFocals() {
            const series = seriesSelect.value;
            focalSelect.innerHTML = '';
            lensData[series].focals.forEach(focal => {
                const opt = document.createElement('option');
                opt.value = focal;
                opt.textContent = `${focal}mm`;
                focalSelect.appendChild(opt);
            });
            focalSelect.selectedIndex = Math.floor(lensData[series].focals.length / 2);
        }

        function getSensor() {
            if (cameraSelect.value === 'custom') {
                return [parseFloat(customWidth.value) || 36, parseFloat(customHeight.value) || 24];
            }
            return cameraSelect.value.split(',').map(Number);
        }

        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            try {
                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: facingMode }, width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: false
                });
                video.srcObject = currentStream;
                cameraActive = true;
                updateButtonState();
            } catch (err) {
                try {
                    currentStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = currentStream;
                    cameraActive = true;
                    updateButtonState();
                } catch (e) {
                    alert("Unable to access camera: " + e.message);
                }
            }
        }

        function stopCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            video.srcObject = null;
            cameraActive = false;
            updateButtonState();
        }

        function updateButtonState() {
            if (cameraActive) {
                toggleCamBtn.textContent = "Disable Feed";
                toggleCamBtn.className = "btn-danger";
            } else {
                toggleCamBtn.textContent = "Enable Camera";
                toggleCamBtn.className = "btn-primary";
            }
        }

        function captureStill() {
            const projectName = projectInput.value.trim() || "Untitled Project";
            const series = seriesSelect.value.toUpperCase();
            const focal = focalSelect.value;
            const cameraName = cameraSelect.options[cameraSelect.selectedIndex].text;
            const dataURL = canvas.toDataURL('image/png');
            const timestamp = new Date().toLocaleString();

            const shotRecord = {
                project: projectName,
                image: dataURL,
                series: series,
                focal: `${focal}mm`,
                camera: cameraName,
                hfov: document.getElementById('hfovVal').textContent,
                aspect: document.getElementById('aspectVal').textContent,
                timestamp: timestamp
            };

            if (db) {
                const tx = db.transaction("shots", "readwrite");
                tx.objectStore("shots").add(shotRecord);
                tx.oncomplete = () => {
                    updateShotCount();
                    snapBtn.textContent = "✔ Saved!";
                    setTimeout(() => snapBtn.textContent = "📸 Save Still", 1200);
                };
            }
        }

        function updateShotCount() {
            if (!db) return;
            const tx = db.transaction("shots", "readonly");
            const countReq = tx.objectStore("shots").count();
            countReq.onsuccess = () => {
                shotCountEl.textContent = countReq.result;
            };
        }

        function loadLookbook() {
            if (!db) return;
            const projectName = projectInput.value.trim() || "Untitled Project";
            lookbookHeaderTitle.innerHTML = `
                <svg class="binder-svg" style="width:20px; height:20px;" viewBox="0 0 24 24">
                    <rect x="5" y="3" width="16" height="18" rx="2"></rect>
                    <line x1="5" y1="3" x2="5" y2="21"></line>
                    <circle cx="3" cy="7" r="1.2" fill="currentColor"></circle>
                    <circle cx="3" cy="12" r="1.2" fill="currentColor"></circle>
                    <circle cx="3" cy="17" r="1.2" fill="currentColor"></circle>
                </svg>
                ${projectName} — Shot Deck
            `;
            lookbookGrid.innerHTML = '';

            const tx = db.transaction("shots", "readonly");
            const req = tx.objectStore("shots").getAll();

            req.onsuccess = () => {
                const shots = req.result;
                if (shots.length === 0) {
                    lookbookGrid.innerHTML = '<div class="empty-msg">No shots captured yet. Snap a still from the viewfinder to build your deck!</div>';
                    return;
                }

                shots.reverse().forEach(shot => {
                    const card = document.createElement('div');
                    card.className = 'lookbook-card';
                    card.innerHTML = `
                        <img src="${shot.image}" alt="Lookbook Still">
                        <div class="lookbook-card-info">
                            <div><strong>Project:</strong> ${shot.project || projectName}</div>
                            <div><strong>Lens:</strong> ${shot.series} ${shot.focal}</div>
                            <div><strong>Camera/Sensor:</strong> ${shot.camera}</div>
                            <div><strong>HFOV / Aspect:</strong> ${shot.hfov} | ${shot.aspect}</div>
                            <div><small>${shot.timestamp}</small></div>
                        </div>
                        <div class="lookbook-card-btns">
                            <button class="btn-secondary" onclick="downloadShot('${shot.image}', '${(shot.project || projectName).replace(/\s+/g, '_')}_${shot.series}_${shot.focal}.png')">💾 Download</button>
                            <button class="btn-danger" onclick="deleteShot(${shot.id})">🗑️ Delete</button>
                        </div>
                    `;
                    lookbookGrid.appendChild(card);
                });
            };
            lookbookModal.classList.remove('hidden');
        }

        window.downloadShot = (dataUrl, filename) => {
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = filename;
            a.click();
        };

        window.deleteShot = (id) => {
            if (!db) return;
            const tx = db.transaction("shots", "readwrite");
            tx.objectStore("shots").delete(id);
            tx.oncomplete = () => {
                updateShotCount();
                loadLookbook();
            };
        };

        clearLookbookBtn.addEventListener('click', () => {
            if (confirm("Are you sure you want to clear all stills from the project lookbook?")) {
                const tx = db.transaction("shots", "readwrite");
                tx.objectStore("shots").clear();
                tx.oncomplete = () => {
                    updateShotCount();
                    loadLookbook();
                };
            }
        });

        // DIRECT PDF FILE GENERATOR (jsPDF with 1col/2col support)
        downloadPdfDirectBtn.addEventListener('click', () => {
            if (!db) return;
            const projectName = projectInput.value.trim() || "Untitled Project";
            const layout = printLayoutSelect.value; // '1col' or '2col'
            const tx = db.transaction("shots", "readonly");
            const req = tx.objectStore("shots").getAll();

            req.onsuccess = async () => {
                const shots = req.result;
                if (shots.length === 0) {
                    alert("No shots to export!");
                    return;
                }

                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('portrait', 'pt', 'letter');
                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();

                let yPos = 40;

                pdf.setFont("helvetica", "bold");
                pdf.setFontSize(16);
                pdf.text(`${projectName.toUpperCase()} — SHOT SHEET`, 40, yPos);
                
                pdf.setFont("helvetica", "normal");
                pdf.setFontSize(8);
                pdf.setTextColor(100);
                pdf.text(`ATLAS LENS CO. VIEWFINDER | Total Shots: ${shots.length} | Generated: ${new Date().toLocaleString()}`, 40, yPos + 14);
                pdf.text(`*DISCLAIMER: For pre-visualization purposes only. Actual framing and optical results may vary on set.`, 40, yPos + 24);

                pdf.setLineWidth(1);
                pdf.setDrawColor(200);
                pdf.line(40, yPos + 30, pageWidth - 40, yPos + 30);

                yPos += 45;

                if (layout === '1col') {
                    // 1 SHOT PER ROW (LARGE)
                    const colWidth = pageWidth - 80;
                    const imgHeight = colWidth * (9 / 16);

                    for (let i = 0; i < shots.length; i++) {
                        const shot = shots[i];

                        if (yPos + imgHeight + 50 > pageHeight) {
                            pdf.addPage();
                            yPos = 40;
                        }

                        pdf.addImage(shot.image, 'PNG', 40, yPos, colWidth, imgHeight);
                        pdf.setDrawColor(180);
                        pdf.rect(40, yPos, colWidth, imgHeight);

                        pdf.setFontSize(10);
                        pdf.setFont("helvetica", "bold");
                        pdf.setTextColor(0);
                        pdf.text(`Shot #${i + 1} — ${shot.series} ${shot.focal}`, 40, yPos + imgHeight + 14);

                        pdf.setFont("helvetica", "normal");
                        pdf.setFontSize(9);
                        pdf.setTextColor(80);
                        pdf.text(`Camera: ${shot.camera}  |  HFOV: ${shot.hfov}  |  Aspect Ratio: ${shot.aspect}  |  Captured: ${shot.timestamp}`, 40, yPos + imgHeight + 26);

                        yPos += imgHeight + 45;
                    }
                } else {
                    // 2 SHOTS PER ROW (GRID)
                    const colWidth = (pageWidth - 100) / 2;
                    const imgHeight = colWidth * (9 / 16);

                    for (let i = 0; i < shots.length; i++) {
                        const shot = shots[i];
                        const col = i % 2;
                        const xPos = 40 + col * (colWidth + 20);

                        if (col === 0 && i > 0 && yPos + imgHeight + 60 > pageHeight) {
                            pdf.addPage();
                            yPos = 40;
                        }

                        pdf.addImage(shot.image, 'PNG', xPos, yPos, colWidth, imgHeight);
                        pdf.setDrawColor(180);
                        pdf.rect(xPos, yPos, colWidth, imgHeight);

                        pdf.setFontSize(9);
                        pdf.setFont("helvetica", "bold");
                        pdf.setTextColor(0);
                        pdf.text(`Shot #${i + 1} — ${shot.series} ${shot.focal}`, xPos, yPos + imgHeight + 12);

                        pdf.setFont("helvetica", "normal");
                        pdf.setTextColor(80);
                        pdf.text(`Camera: ${shot.camera}`, xPos, yPos + imgHeight + 22);
                        pdf.text(`HFOV: ${shot.hfov} | Aspect: ${shot.aspect}`, xPos, yPos + imgHeight + 32);

                        if (col === 1 || i === shots.length - 1) {
                            yPos += imgHeight + 50;
                        }
                    }
                }

                pdf.save(`${projectName.replace(/\s+/g, '_')}_Shot_Sheet.pdf`);
            };
        });

        // PRINT OVERLAY HANDLER (Adaptive Multi-Page Printing)
        exportPdfBtn.addEventListener('click', () => {
            if (!db) return;
            const projectName = projectInput.value.trim() || "Untitled Project";
            const layout = printLayoutSelect.value; // '1col' or '2col'
            const tx = db.transaction("shots", "readonly");
            const req = tx.objectStore("shots").getAll();

            req.onsuccess = () => {
                const shots = req.result;
                if (shots.length === 0) {
                    alert("No shots to export!");
                    return;
                }

                const existing = document.getElementById('pdfPrintContainer');
                if (existing) existing.remove();

                const gridClass = (layout === '1col') ? 'grid-1col' : 'grid-2col';

                let html = `
                    <div id="pdfPrintContainer">
                        <div class="no-print" style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #000; padding-bottom:10px; margin-bottom:20px;">
                            <div>
                                <h1 style="margin:0; font-size:20px; color:#000;">${projectName.toUpperCase()} — SHOT SHEET</h1>
                                <p style="margin:4px 0 0 0; font-size:12px; color:#555;">ATLAS LENS CO. VIEWFINDER | Total Shots: ${shots.length}</p>
                            </div>
                            <div style="display:flex; gap:10px;">
                                <button onclick="window.print()" style="padding:8px 16px; background:#e5a93b; color:#000; border:none; font-weight:bold; border-radius:4px; cursor:pointer;">🖨️ Print Now</button>
                                <button onclick="document.getElementById('pdfPrintContainer').remove()" style="padding:8px 16px; background:#333; color:#fff; border:none; font-weight:bold; border-radius:4px; cursor:pointer;">✖ Close</button>
                            </div>
                        </div>

                        <!-- Document Header for Physical Prints -->
                        <div style="margin-bottom: 16px; border-bottom: 2px solid #000; padding-bottom: 6px;">
                            <h1 style="margin: 0; font-size: 20px; color: #000; text-transform: uppercase;">${projectName} — SHOT SHEET</h1>
                            <p style="margin: 4px 0 0 0; font-size: 11px; color: #666;">ATLAS LENS CO. VIEWFINDER | Total Shots: ${shots.length} | ${new Date().toLocaleString()}</p>
                            <p style="margin: 2px 0 0 0; font-size: 10px; color: #888;">*DISCLAIMER: For pre-visualization purposes only. Actual optical framing and distortion may vary on set.</p>
                        </div>

                        <div class="print-grid ${gridClass}">
                `;

                shots.forEach((shot, idx) => {
                    html += `
                        <div class="print-card">
                            <img src="${shot.image}" />
                            <div style="font-size:12px; margin-top:8px; line-height:1.4; color:#111;">
                                <strong>Shot #${idx + 1}</strong> — ${shot.series} ${shot.focal}<br/>
                                <strong>Camera:</strong> ${shot.camera}<br/>
                                <strong>HFOV / Aspect:</strong> ${shot.hfov} | ${shot.aspect}<br/>
                                <span style="color:#666; font-size:10px;">${shot.timestamp}</span>
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;

                const container = document.createElement('div');
                container.innerHTML = html;
                document.body.appendChild(container.firstElementChild);

                setTimeout(() => window.print(), 300);
            };
        });

        function drawGuideBox(frameRect, targetRatio, color, labelText) {
            const currentRatio = frameRect.w / frameRect.h;
            let guideW, guideH;

            if (targetRatio <= currentRatio) {
                guideH = frameRect.h;
                guideW = guideH * targetRatio;
            } else {
                guideW = frameRect.w;
                guideH = guideW / targetRatio;
            }

            const gx = frameRect.x + (frameRect.w - guideW) / 2;
            const gy = frameRect.y + (frameRect.h - guideH) / 2;

            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 4]);
            ctx.strokeRect(gx, gy, guideW, guideH);
            ctx.setLineDash([]);

            ctx.fillStyle = color;
            ctx.font = '11px "Futura-Medium", "Futura", sans-serif';
            ctx.fillText(labelText, gx + 6, gy + 14);
        }

        function render() {
            const [sensorW, sensorH] = getSensor();
            const series = seriesSelect.value;
            const squeeze = lensData[series].squeeze;
            const focal = parseFloat(focalSelect.value);
            const overlayMode = overlaySelect.value;
            const projectName = projectInput.value.trim() || "Untitled Project";

            // Calculations
            const hfovRad = 2 * Math.atan((sensorW * squeeze) / (2 * focal));
            const hfovDeg = (hfovRad * (180 / Math.PI)).toFixed(1);
            const nativeAspect = sensorW / sensorH;
            const finalAspect = (nativeAspect * squeeze).toFixed(2);
            const sphericalEquiv = Math.round(focal / squeeze);

            document.getElementById('hfovVal').textContent = `${hfovDeg}°`;
            document.getElementById('aspectVal').textContent = `${finalAspect}:1`;
            document.getElementById('equivVal').textContent = `~${sphericalEquiv}mm`;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            const effectiveFocal = focal / squeeze;
            const targetWidthRatio = nativeAspect * squeeze;
            const wideScaleFactor = Math.min(1, effectiveFocal / IPHONE_BASE_FOCAL);

            let drawH = (canvas.height - 40) * wideScaleFactor;
            let drawW = drawH * targetWidthRatio;

            if (drawW > canvas.width - 40) {
                drawW = canvas.width - 60;
                drawH = drawW / targetWidthRatio;
            }

            const frameRect = {
                x: centerX - drawW / 2,
                y: centerY - drawH / 2,
                w: drawW,
                h: drawH
            };

            // Render camera stream with Anamorphic Squeeze + Dynamic Zoom
            if (cameraActive && video.readyState === video.HAVE_ENOUGH_DATA) {
                ctx.save();

                ctx.beginPath();
                ctx.rect(frameRect.x, frameRect.y, frameRect.w, frameRect.h);
                ctx.clip();

                const zoomFactor = Math.max(1, effectiveFocal / IPHONE_BASE_FOCAL);

                const srcW = video.videoWidth / zoomFactor;
                const srcH = video.videoHeight / zoomFactor;
                const srcX = (video.videoWidth - srcW) / 2;
                const srcY = (video.videoHeight - srcH) / 2;

                if (facingMode === "user") {
                    ctx.translate(canvas.width, 0);
                    ctx.scale(-1, 1);
                    const mirroredX = canvas.width - (frameRect.x + frameRect.w);
                    ctx.drawImage(video, srcX, srcY, srcW, srcH, mirroredX, frameRect.y, frameRect.w, frameRect.h);
                } else {
                    ctx.drawImage(video, srcX, srcY, srcW, srcH, frameRect.x, frameRect.y, frameRect.w, frameRect.h);
                }

                ctx.restore();
            } else {
                ctx.fillStyle = '#08080a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#a0a0ab';
                ctx.font = '16px "Futura-Medium", "Futura", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Camera Feed Disabled', centerX, centerY);
                ctx.textAlign = 'left';
            }

            // Outer Sensor Letterbox Matte
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(0, 0, canvas.width, frameRect.y);
            ctx.fillRect(0, frameRect.y + frameRect.h, canvas.width, canvas.height - (frameRect.y + frameRect.h));
            ctx.fillRect(0, frameRect.y, frameRect.x, frameRect.h);
            ctx.fillRect(frameRect.x + frameRect.w, frameRect.y, canvas.width - (frameRect.x + frameRect.w), frameRect.h);

            // Active Sensor Border (Cyan Solid)
            ctx.strokeStyle = '#00d2ff';
            ctx.lineWidth = 3;
            ctx.strokeRect(frameRect.x, frameRect.y, frameRect.w, frameRect.h);

            // Delivery Aspect Ratio Overlays
            if (overlayMode === 'all') {
                drawGuideBox(frameRect, 2.39, '#e5a93b', '2.39:1 Scope');
                drawGuideBox(frameRect, 2.00, '#ff007f', '2.00:1 Stream');
                drawGuideBox(frameRect, 1.85, '#34c759', '1.85:1 Flat');
                drawGuideBox(frameRect, 1.78, '#ffffff', '16:9 HD');
                drawGuideBox(frameRect, 1.00, '#a0a0ab', '1:1 Square');
            } else if (overlayMode !== 'none') {
                const ratio = parseFloat(overlayMode);
                const label = `${ratio}:1 Guide`;
                drawGuideBox(frameRect, ratio, '#e5a93b', label);
            }

            // Center Crosshair
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(centerX - 16, centerY); ctx.lineTo(centerX + 16, centerY);
            ctx.moveTo(centerX, centerY - 16); ctx.lineTo(centerX, centerY + 16);
            ctx.stroke();

            // On-screen Lens Metadata Readout (Top Left)
            ctx.fillStyle = '#e5a93b';
            ctx.font = '500 16px "Futura-Medium", "Futura", sans-serif';
            ctx.fillText(`${series.toUpperCase()} ${focal}mm (${squeeze}x)`, frameRect.x + 14, frameRect.y + 26);

            // On-screen Project Title Burn-in (Top Right)
            ctx.fillStyle = '#00d2ff';
            ctx.font = '500 14px "Futura-Medium", "Futura", sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(projectName.toUpperCase(), frameRect.x + frameRect.w - 14, frameRect.y + 26);

            // On-screen Pre-Vis Disclaimer Watermark (Bottom Center)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.font = '10px "Futura-Medium", "Futura", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('*PRE-VISUALIZATION ONLY — ACTUAL RESULTS MAY VARY', centerX, frameRect.y + frameRect.h - 10);
            ctx.textAlign = 'left';

            requestAnimationFrame(render);
        }

        // Event Listeners
        toggleCamBtn.addEventListener('click', () => {
            if (cameraActive) stopCamera();
            else startCamera();
        });

        flipCamBtn.addEventListener('click', () => {
            facingMode = (facingMode === "environment") ? "user" : "environment";
            if (cameraActive) startCamera();
        });

        snapBtn.addEventListener('click', captureStill);
        openLookbookBtn.addEventListener('click', loadLookbook);
        closeLookbookBtn.addEventListener('click', () => lookbookModal.classList.add('hidden'));

        cameraSelect.addEventListener('change', () => {
            if (cameraSelect.value === 'custom') customGroup.classList.remove('hidden');
            else customGroup.classList.add('hidden');
        });

        seriesSelect.addEventListener('change', populateFocals);

        populateFocals();
        requestAnimationFrame(render);
    </script>
</body>
</html>
