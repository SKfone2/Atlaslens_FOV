<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Atlas Lens Co. FOV Visualizer & Calculator</title>

    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">

    <!-- iOS / Safari Specific Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Atlas FOV">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent-gold: #e5a93b;
            --accent-cyan: #00d2ff;
            --text-main: #ececec;
            --text-muted: #a0a0ab;
            --border: #33333d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--accent-gold);
            margin-bottom: 5px;
            font-weight: 600;
            letter-spacing: 1px;
            font-size: 1.6rem;
            text-align: center;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 0.9rem;
            text-align: center;
        }

        .container {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 24px;
            width: 100%;
            max-width: 1200px;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .control-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        select, input {
            width: 100%;
            padding: 10px 12px;
            background: #141418;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--accent-gold);
        }

        .custom-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }

        .hidden {
            display: none !important;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .stat-card {
            background: #141418;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-card .val {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent-gold);
        }

        .stat-card .lbl {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* Canvas & Viewport Styling */
        .viewport-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        canvas {
            background-color: #08080a;
            border: 1px solid var(--border);
            border-radius: 8px;
            width: 100%;
            height: auto;
            max-height: 520px;
        }

        .legend {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            font-size: 0.85rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <h1>ATLAS LENS CO. FOV VISUALIZER</h1>
    <p class="subtitle">Anamorphic Field of View & Desqueezed Aspect Ratio Calculator</p>

    <div class="container">
        <!-- Controls Panel -->
        <div class="panel">
            <div class="control-group">
                <label for="cameraSelect">Camera / Sensor Format</label>
                <select id="cameraSelect">
                    <option value="35.70,20.10">Sony FX6 (Full Frame 16:9)</option>
                    <option value="35.90,23.90">Canon EOS R6 Mark III (Full Frame 3:2)</option>
                    <option value="36.70,25.54">ARRI ALEXA Mini LF (Open Gate 4.5K)</option>
                    <option value="27.99,18.13">ARRI ALEXA 35 (4:3 Full Height 4.6K)</option>
                    <option value="40.96,21.60">RED V-Raptor 8K VV</option>
                    <option value="36.00,24.00">Sony Venice 2 (36x24 Full Frame 3:2)</option>
                    <option value="24.89,18.66">Super 35mm (4:3 Native)</option>
                    <option value="10.07,7.56">Apple iPhone 16 Pro (Main 1/1.28" Sensor 4:3)</option>
                    <option value="custom">Custom Sensor (Manual Entry)</option>
                </select>

                <div id="customGroup" class="custom-inputs hidden">
                    <div>
                        <label for="customWidth">Width (mm)</label>
                        <input type="number" id="customWidth" value="36.00" step="0.1" min="1">
                    </div>
                    <div>
                        <label for="customHeight">Height (mm)</label>
                        <input type="number" id="customHeight" value="24.00" step="0.1" min="1">
                    </div>
                </div>
            </div>

            <div class="control-group">
                <label for="seriesSelect">Lens Series</label>
                <select id="seriesSelect">
                    <option value="orion">Orion Series (2.0x Anamorphic)</option>
                    <option value="mercury">Mercury Series (1.5x Anamorphic)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="focalSelect">Focal Length</label>
                <select id="focalSelect"></select>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="val" id="hfovVal">0°</div>
                    <div class="lbl">Effective HFOV</div>
                </div>
                <div class="stat-card">
                    <div class="val" id="vfovVal">0°</div>
                    <div class="lbl">VFOV</div>
                </div>
                <div class="stat-card">
                    <div class="val" id="aspectVal">2.39:1</div>
                    <div class="lbl">Desqueezed Aspect</div>
                </div>
                <div class="stat-card">
                    <div class="val" id="equivVal">0mm</div>
                    <div class="lbl">Spherical Equiv.</div>
                </div>
            </div>
        </div>

        <!-- Viewport Visualizer Panel -->
        <div class="panel viewport-container">
            <canvas id="fovCanvas" width="800" height="480"></canvas>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: var(--accent-gold);"></div>
                    <span>Squeezed Sensor Frame</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: var(--accent-cyan);"></div>
                    <span>Desqueezed Active View</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Data Structures
        const lensData = {
            orion: {
                squeeze: 2.0,
                focals: [18, 21, 25, 32, 40, 50, 65, 80, 100, 138, 200]
            },
            mercury: {
                squeeze: 1.5,
                focals: [24, 27, 32, 36, 42, 54, 72, 95, 138]
            }
        };

        // DOM Elements
        const cameraSelect = document.getElementById('cameraSelect');
        const customGroup = document.getElementById('customGroup');
        const customWidth = document.getElementById('customWidth');
        const customHeight = document.getElementById('customHeight');
        const seriesSelect = document.getElementById('seriesSelect');
        const focalSelect = document.getElementById('focalSelect');
        const hfovVal = document.getElementById('hfovVal');
        const vfovVal = document.getElementById('vfovVal');
        const aspectVal = document.getElementById('aspectVal');
        const equivVal = document.getElementById('equivVal');
        const canvas = document.getElementById('fovCanvas');
        const ctx = canvas.getContext('2d');

        function populateFocalLengths() {
            const series = seriesSelect.value;
            focalSelect.innerHTML = '';
            lensData[series].focals.forEach(focal => {
                const opt = document.createElement('option');
                opt.value = focal;
                opt.textContent = `${focal}mm`;
                focalSelect.appendChild(opt);
            });
            focalSelect.selectedIndex = Math.floor(lensData[series].focals.length / 2);
        }

        function getSensorDimensions() {
            if (cameraSelect.value === 'custom') {
                const w = parseFloat(customWidth.value) || 36.0;
                const h = parseFloat(customHeight.value) || 24.0;
                return [w, h];
            } else {
                return cameraSelect.value.split(',').map(Number);
            }
        }

        function calculateAndDraw() {
            const [sensorW, sensorH] = getSensorDimensions();
            const series = seriesSelect.value;
            const squeeze = lensData[series].squeeze;
            const focal = parseFloat(focalSelect.value);

            // Calculations
            const hfovRad = 2 * Math.atan((sensorW * squeeze) / (2 * focal));
            const hfovDeg = (hfovRad * (180 / Math.PI)).toFixed(1);

            const vfovRad = 2 * Math.atan(sensorH / (2 * focal));
            const vfovDeg = (vfovRad * (180 / Math.PI)).toFixed(1);

            const sphericalEquiv = Math.round(focal / squeeze);

            const nativeAspect = sensorW / sensorH;
            const finalAspect = (nativeAspect * squeeze).toFixed(2);

            // Update UI
            hfovVal.textContent = `${hfovDeg}°`;
            vfovVal.textContent = `${vfovDeg}°`;
            aspectVal.textContent = `${finalAspect}:1`;
            equivVal.textContent = `~${sphericalEquiv}mm`;

            // Canvas Visualization
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const scale = 8.5;

            // 1. Draw Camera Sensor Box (Raw 1:1)
            const rawW = sensorW * scale;
            const rawH = sensorH * scale;

            ctx.strokeStyle = '#e5a93b';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 4]);
            ctx.strokeRect(centerX - rawW / 2, centerY - rawH / 2, rawW, rawH);

            // 2. Draw Desqueezed Viewport Box
            const desqueezedW = rawW * squeeze;
            const desqueezedH = rawH;

            const maxAllowedW = canvas.width - 60;
            const maxAllowedH = canvas.height - 60;
            let fitScale = 1;

            if (desqueezedW > maxAllowedW || desqueezedH > maxAllowedH) {
                fitScale = Math.min(maxAllowedW / desqueezedW, maxAllowedH / desqueezedH);
            }

            const drawW = desqueezedW * fitScale;
            const drawH = desqueezedH * fitScale;

            ctx.strokeStyle = '#00d2ff';
            ctx.lineWidth = 3;
            ctx.setLineDash([]);
            ctx.strokeRect(centerX - drawW / 2, centerY - drawH / 2, drawW, drawH);

            // 3. Text Overlay on Canvas
            ctx.fillStyle = '#a0a0ab';
            ctx.font = '12px -apple-system, sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`Sensor Area: ${sensorW}mm × ${sensorH}mm`, 20, canvas.height - 20);
            ctx.textAlign = 'right';
            ctx.fillText(`Desqueezed FOV: ${hfovDeg}° (H) × ${vfovDeg}° (V)`, canvas.width - 20, canvas.height - 20);
        }

        // Event Listeners
        cameraSelect.addEventListener('change', () => {
            if (cameraSelect.value === 'custom') {
                customGroup.classList.remove('hidden');
            } else {
                customGroup.classList.add('hidden');
            }
            calculateAndDraw();
        });

        customWidth.addEventListener('input', calculateAndDraw);
        customHeight.addEventListener('input', calculateAndDraw);

        seriesSelect.addEventListener('change', () => {
            populateFocalLengths();
            calculateAndDraw();
        });

        focalSelect.addEventListener('change', calculateAndDraw);

        // Initial Setup
        populateFocalLengths();
        calculateAndDraw();

        // Register Service Worker for PWA Offline functionality
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker registered:', reg.scope))
                    .catch((err) => console.error('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
